[package]
name = "steam-tracker"
version = "0.1.0"
description = "A Steam presence monitor for the Windows system tray"
authors = ["SilverWallDiscs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"