name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steamtracker-windows-build
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled Node.js and npm on Windows runner
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rich Presence bridge dependencies outside repository
        shell: pwsh
        run: |
          $helperRuntime = Join-Path $env:RUNNER_TEMP "SteamTrackerHelper"
          New-Item -ItemType Directory -Force -Path $helperRuntime | Out-Null
          Copy-Item "rich-presence-helper/package.json" "$helperRuntime/package.json" -Force
          Copy-Item "rich-presence-helper/index.cjs" "$helperRuntime/index.cjs" -Force
          npm install --prefix "$helperRuntime" --omit=dev

      - name: Bundle private Rich Presence runtime
        shell: pwsh
        run: |
          $helperRuntime = Join-Path $env:RUNNER_TEMP "SteamTrackerHelper"
          $destination = Join-Path $PWD "src-tauri/resources/rich-presence-helper"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $destination = (Resolve-Path $destination).Path
          $helperRuntime = (Resolve-Path $helperRuntime).Path
          Copy-Item "$helperRuntime/index.cjs" "$destination/index.cjs" -Force
          Copy-Item (Get-Command node).Source "$destination/node.exe" -Force
          $modulesSource = Join-Path $helperRuntime "node_modules"
          if (-not (Test-Path (Join-Path $modulesSource "steam-session/package.json"))) {
            throw "npm did not install steam-session into the Rich Presence runtime"
          }
          if (-not (Test-Path (Join-Path $modulesSource "steam-user/package.json"))) {
            throw "npm did not install steam-user into the Rich Presence runtime"
          }
          Copy-Item -Path $modulesSource -Destination (Join-Path $destination "node_modules") -Recurse -Force
          foreach ($required in @("node.exe", "index.cjs")) {
            if (-not (Test-Path (Join-Path $destination $required))) {
              throw "Missing bundled Rich Presence runtime file: $required"
            }
          }
          foreach ($required in @("steam-session/package.json", "steam-user/package.json")) {
            if (-not (Test-Path (Join-Path $destination "node_modules/$required"))) {
              throw "Missing bundled Rich Presence dependency: $required"
            }
          }
          Get-ChildItem $destination | Select-Object Name,Length

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Verify packaged Rich Presence runtime
        shell: pwsh
        run: |
          $runtime = "src-tauri/target/release/rich-presence-helper"
          foreach ($required in @("node.exe", "index.cjs")) {
            if (-not (Test-Path (Join-Path $runtime $required))) {
              throw "The Tauri bundle is missing Rich Presence file: $required in $runtime"
            }
          }
          foreach ($required in @("steam-session/package.json", "steam-user/package.json")) {
            if (-not (Test-Path (Join-Path $runtime "node_modules/$required"))) {
              throw "The Tauri bundle is missing Rich Presence dependency: $required"
            }
          }
          Write-Host "Verified Rich Presence runtime and dependency packages in $runtime"
          (Get-Item (Join-Path $runtime "node_modules/steam-session/package.json")).FullName
          (Get-Item (Join-Path $runtime "node_modules/steam-user/package.json")).FullName
          Push-Location $runtime
          try {
            & ".\\node.exe" -e "require('steam-session'); require('steam-user'); console.log('Rich Presence modules loaded successfully')"
            if ($LASTEXITCODE -ne 0) {
              throw "Bundled Node.js could not load steam-session and steam-user"
            }
          } finally {
            Pop-Location
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SteamTracker-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30