name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rich Presence bridge dependencies
        run: npm install --prefix rich-presence-helper --omit=dev

      - name: Bundle private Rich Presence runtime
        shell: pwsh
        run: |
          $destination = "src-tauri/resources/rich-presence-helper"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "rich-presence-helper/index.cjs" "$destination/index.cjs" -Force
          robocopy "rich-presence-helper/node_modules" "$destination/node_modules" /MIR /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $nodeExecutable = (Get-Command node).Source
          Copy-Item $nodeExecutable "$destination/node.exe" -Force
          Write-Host "Bundled Node runtime: $nodeExecutable"
          Write-Host "Bundled helper file count:" (Get-ChildItem $destination -File -Recurse | Measure-Object).Count

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SteamTracker-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30