name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steamtracker-windows-build
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled Node.js and npm on Windows runner
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rich Presence bridge dependencies outside repository
        shell: pwsh
        run: |
          $helperRuntime = Join-Path $env:RUNNER_TEMP "SteamTrackerHelper"
          New-Item -ItemType Directory -Force -Path $helperRuntime | Out-Null
          Copy-Item "rich-presence-helper/package.json" "$helperRuntime/package.json" -Force
          Copy-Item "rich-presence-helper/index.cjs" "$helperRuntime/index.cjs" -Force
          npm install --prefix "$helperRuntime" --omit=dev

      - name: Bundle private Rich Presence runtime
        shell: pwsh
        run: |
          $helperRuntime = Join-Path $env:RUNNER_TEMP "SteamTrackerHelper"
          $destination = Join-Path $PWD "src-tauri/resources/rich-presence-helper"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $destination = (Resolve-Path $destination).Path
          $helperRuntime = (Resolve-Path $helperRuntime).Path
          Copy-Item "$helperRuntime/index.cjs" "$destination/index.cjs" -Force
          Copy-Item (Get-Command node).Source "$destination/node.exe" -Force

          $archive = Join-Path $env:RUNNER_TEMP "SteamTrackerNodeModules.tar"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          & tar.exe -cf $archive -C $helperRuntime "node_modules"
          if ($LASTEXITCODE -ne 0) { throw "Failed to archive Rich Presence dependencies (exit $LASTEXITCODE)" }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "SteamTrackerNodeModulesCheck"
          if (Test-Path $verifyRoot) { Remove-Item $verifyRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $verifyRoot | Out-Null
          & tar.exe -xf $archive -C $verifyRoot
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract Rich Presence dependency archive" }

          foreach ($required in @("steam-session/package.json", "steam-user/package.json")) {
            if (-not (Test-Path (Join-Path $verifyRoot "node_modules/$required"))) {
              throw "Dependency archive is missing $required"
            }
          }

          Push-Location $verifyRoot
          try {
            & (Get-Command node).Source -e "require('steam-session'); require('steam-user'); console.log('Rich Presence modules loaded successfully')"
            if ($LASTEXITCODE -ne 0) { throw "Node.js could not load the archived Rich Presence modules" }
          } finally {
            Pop-Location
          }

          Copy-Item $archive (Join-Path $destination "node_modules.tar") -Force
          foreach ($required in @("node.exe", "index.cjs", "node_modules.tar")) {
            if (-not (Test-Path (Join-Path $destination $required))) {
              throw "Missing bundled Rich Presence runtime file: $required"
            }
          }
          Get-ChildItem $destination | Select-Object Name,Length

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Verify packaged Rich Presence runtime
        shell: pwsh
        run: |
          $runtime = "src-tauri/target/release/rich-presence-helper"
          foreach ($required in @("node.exe", "index.cjs", "node_modules.tar")) {
            if (-not (Test-Path (Join-Path $runtime $required))) {
              throw "The Tauri bundle is missing Rich Presence file: $required in $runtime"
            }
          }
          $archiveCheck = Join-Path $env:RUNNER_TEMP "SteamTrackerPackagedModulesCheck"
          if (Test-Path $archiveCheck) { Remove-Item $archiveCheck -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archiveCheck | Out-Null
          & tar.exe -xf (Join-Path $runtime "node_modules.tar") -C $archiveCheck
          if ($LASTEXITCODE -ne 0) { throw "The packaged Rich Presence archive could not be extracted" }
          foreach ($required in @("steam-session/package.json", "steam-user/package.json")) {
            if (-not (Test-Path (Join-Path $archiveCheck "node_modules/$required"))) {
              throw "The packaged archive is missing $required"
            }
          }
          Push-Location $archiveCheck
          try {
            & (Join-Path $runtime "node.exe") -e "require('steam-session'); require('steam-user'); console.log('Packaged Rich Presence modules loaded successfully')"
            if ($LASTEXITCODE -ne 0) { throw "Packaged Node.js could not load the Rich Presence modules" }
          } finally {
            Pop-Location
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SteamTracker-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30